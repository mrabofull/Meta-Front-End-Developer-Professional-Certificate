<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Bistro - Book a Table</title>
</head>
<body>
  <header>
    <img src="greenbistro-logo.png" alt="Green Bistro logo">
  </header>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="reservations.html">Reservations</a></li>
    </ul>
  </nav>
  <main>
    <h1>Book a Table</h1>

    <form method="POST">
      <div>
        <label for="booking_date">Booking Date</label>
        <input type="date" name="booking_date" id="booking_date">
      </div>
      <div>
        <label for="booking_people">Number of People</label>
        <input type="range" name="booking_people" id="booking_people" min="1" max="10" value="4" oninput="this.nextElementSibling.value = this.value">
        <output>4</output>
      </div>
      <div>
        <label for="booking_location">Location</label>
        <input id="booking_location" name="booking_location" list="locations">
        <datalist id="locations">
          <option value="Downtown"></option>
          <option value="Uptown"></option>
          <option value="Riverside"></option>
          <option value="Countryside"></option>
        </datalist>
      </div>
      <div>
        <button type="submit">Book Table</button>
      </div>
    </form>
  </main>
  <footer>
    <p>Copyright Green Bistro</p>
  </footer>
</body>
</html>
