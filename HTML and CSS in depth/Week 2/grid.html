<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  
  <style>
    /* Global Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: grid;
      grid-template-columns: 1fr; /* Default: single column layout */
      grid-template-rows: auto 1fr auto;
      grid-template-areas: "header" "gallery" "footer";
      height: 100vh;
    }

    /* Header Styles */
    header {
      grid-area: header;
      background-color: #2C3333;
      color: white;
      text-align: center;
      padding: 2rem;
    }

    /* Main Gallery Styles */
    .gallery {
      grid-area: gallery;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr; /* Three columns in gallery */
      gap: 1rem;
      padding: 1rem;
      justify-items: center;
      align-items: center;
    }

    .photo {
      width: 100%;
      max-width: 250px;
      height: 200px;
      background-color: lightgrey;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 18px;
      text-transform: uppercase;
    }

    /* Footer Styles */
    footer {
      grid-area: footer;
      background-color: #A5C9CA;
      text-align: center;
      padding: 1rem;
    }

    /* Responsive Design: for screens 600px and above */
    @media (min-width: 600px) {
      body {
        grid-template-columns: 1fr 2fr; /* Two columns, main content wider */
        grid-template-areas: "header header" "gallery footer";
      }

      .gallery {
        grid-template-columns: 1fr 1fr 1fr 1fr; /* Four columns in gallery */
      }
    }

    /* Responsive Design: for screens 900px and above */
    @media (min-width: 900px) {
      body {
        grid-template-columns: 1fr 3fr; /* Even wider layout */
      }

      .gallery {
        grid-template-columns: 1fr 1fr 1fr 1fr 1fr; /* Five columns in gallery */
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Photo Gallery</h1>
  </header>

  <div class="gallery">
    <div class="photo">Photo 1</div>
    <div class="photo">Photo 2</div>
    <div class="photo">Photo 3</div>
    <div class="photo">Photo 4</div>
    <div class="photo">Photo 5</div>
    <div class="photo">Photo 6</div>
  </div>

  <footer>
    <p>&copy; 2025 Photo Gallery | All rights reserved</p>
  </footer>

</body>
</html>
